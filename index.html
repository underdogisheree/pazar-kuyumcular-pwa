<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="theme-color"
        content="#ef6c2f"
    >

    <meta
        name="description"
        content="Pazar Kuyumcular canlı altın fiyat hesaplama uygulaması"
    >

    <link rel="manifest" href="manifest.json">

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Pazar Kuyumcular</title>

</head>


<body>

    <main class="container">


        <!-- ================================================= -->
        <!-- BAŞLIK -->
        <!-- ================================================= -->

        <header class="header">

            <h1>
                PAZAR KUYUMCULAR
            </h1>

            <p>
                CANLI ALTIN FİYATLARI
            </p>

        </header>


        <!-- ================================================= -->
        <!-- HAS ALTIN -->
        <!-- ================================================= -->

        <section class="has-altin-card">

            <div class="has-altin-title">
                HAS ALTIN
            </div>


            <div class="has-altin-prices">


                <!-- HAS ALTIN ALIŞ -->

                <div class="has-price-box">

                    <span class="has-price-label">
                        ALIŞ
                    </span>

                    <strong
                        id="hasAltinBozusPrice"
                        class="has-price"
                    >
                        -
                    </strong>

                </div>


                <!-- HAS ALTIN SATIŞ -->

                <div class="has-price-box">

                    <span class="has-price-label">
                        SATIŞ
                    </span>

                    <strong
                        id="hasAltinPrice"
                        class="has-price"
                    >
                        -
                    </strong>

                </div>


            </div>

        </section>


        <!-- ================================================= -->
        <!-- FİYAT TABLOSU -->
        <!-- ================================================= -->

        <section class="price-section">


            <div class="table-header">

                <div>
                    ÜRÜN
                </div>

                <div>
                    ALIŞ
                </div>

                <div>
                    SATIŞ
                </div>

            </div>


            <!-- 24 AYAR -->

            <div class="price-row">

                <div class="product-name">
                    24 AYAR
                </div>

                <div
                    id="ayar24Bozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="ayar24Satis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


            <!-- 22 AYAR -->

            <div class="price-row">

                <div class="product-name">
                    22 AYAR
                </div>

                <div
                    id="ayar22Bozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="ayar22Satis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


            <!-- ATA TAM -->

            <div class="price-row">

                <div class="product-name">
                    ATA TAM
                </div>

                <div
                    id="tamCumhuriyetBozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="tamCumhuriyetSatis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


            <!-- ATA ÇEYREK -->

            <div class="price-row">

                <div class="product-name">
                    ATA ÇEYREK
                </div>

                <div
                    id="ceyrekCumhuriyetBozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="ceyrekCumhuriyetSatis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


            <!-- TAM ZİYNET -->

            <div class="price-row">

                <div class="product-name">
                    TAM ZİYNET
                </div>

                <div
                    id="tamZiynetBozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="tamZiynetSatis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


            <!-- ZİYNET ÇEYREK -->

            <div class="price-row">

                <div class="product-name">
                    ZİYNET ÇEYREK
                </div>

                <div
                    id="ceyrekZiynetBozus"
                    class="buy-price"
                >
                    -
                </div>

                <div
                    id="ceyrekZiynetSatis"
                    class="sell-price"
                >
                    -
                </div>

            </div>


        </section>


        <!-- ================================================= -->
        <!-- DURUM -->
        <!-- ================================================= -->

        <section class="status-card">


            <div class="status-row">

                <span>
                    BAĞLANTI
                </span>

                <span
                    id="connectionStatus"
                    class="status waiting"
                >
                    Bağlanıyor...
                </span>

            </div>


            <div class="status-row">

                <span>
                    SON GÜNCELLEME
                </span>

                <span id="updateTime">
                    -
                </span>

            </div>


        </section>


        <!-- ================================================= -->
        <!-- ALT BİLGİ -->
        <!-- ================================================= -->

        <footer>

            <strong>
                Hayırlı işler, bol kazançlar...
            </strong>

        </footer>


    </main>


    <!-- ================================================= -->
    <!-- SOCKET.IO -->
    <!-- ================================================= -->

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>


    <!-- ================================================= -->
    <!-- UYGULAMA -->
    <!-- ================================================= -->

    <script src="app.js"></script>


</body>

</html>
